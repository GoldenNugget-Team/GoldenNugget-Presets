name: Publish catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}index.json
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the catalog
        uses: actions/checkout@v5
        with:
          path: catalog

      - name: Check out GoldenNugget
        uses: actions/checkout@v5
        with:
          repository: GoldenNugget-Team/GoldenNugget
          ref: main
          path: gn

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: gn/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libgl1
          python -m pip install --upgrade pip
          python -m pip install -r gn/requirements.txt

      - name: Build index.json
        run: python gn/tools/preset_catalog.py build catalog _site/index.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
